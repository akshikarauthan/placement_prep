<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Quiz | Placement Prep</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Playfair+Display:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link href="css/theme.css" rel="stylesheet">
    <style>
      /* Quiz page specific polish */
      body { background: linear-gradient(180deg,#fbfbfc,#f6f7fb); }
      .container {
        max-width: 880px; margin: 30px auto; padding: 28px; border-radius: 14px; box-shadow: 0 10px 30px rgba(15,23,42,0.06); background: linear-gradient(180deg,#ffffff,#fffefc);
      }
      h1 { text-align:center; margin-bottom: 18px; font-family: 'Playfair Display', serif; color: var(--primary-color); }
      .mode-selection { text-align:center; margin-top: 8px; }
      .mode-selection button { padding: 12px 24px; margin: 8px; border-radius: 10px; font-weight:700; box-shadow: 0 6px 18px rgba(11,21,41,0.04); transition: transform .15s ease; }
      .mode-selection button:hover { transform: translateY(-4px); }
      #easyBtn { background: linear-gradient(90deg,#34d399,#10b981); color: #042c1f; }
      #mediumBtn { background: linear-gradient(90deg,#facc15,#f59e0b); color:#3b2f00; }
      #hardBtn { background: linear-gradient(90deg,#f97316,#ef4444); color:#fff; }

      .quiz-area { display:none; margin-top: 26px; padding: 22px; border-radius: 12px; background: linear-gradient(180deg,#fff,#fffaf0); box-shadow: 0 6px 18px rgba(11,21,41,0.05); }
      #question-counter { font-size: 16px; color: #6b7280; font-weight:600; }
      #question-title { font-size:20px; margin-top: 8px; color:#0f172a; font-weight:600; }
      #link-display { margin-top: 18px; }
      #link-display a { color: var(--accent-color-3); font-weight:700; }
      .quiz-controls { margin-top: 18px; }
      .quiz-controls button { padding: 10px 18px; border-radius: 10px; border:none; cursor:pointer; font-weight:700; }
      #revealBtn { background: linear-gradient(90deg,#06b6d4,#0891b2); color:#fff; }
      #nextBtn { background: linear-gradient(90deg,#8b0000,#4b0082); color:#fff; }

      .results { text-align:center; display:none; padding:30px; }
      .results h2 { font-family:'Playfair Display', serif; color:var(--primary-color); }
      .results button { margin-top: 12px; padding:10px 18px; border-radius:10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>DSA Practice Quiz 🧠</h1>

        <div id="mode-selection" class="mode-selection">
            <p style="text-align: center; font-size: 1.1em;">Select a difficulty mode to begin your practice:</p>
            <div style="display: flex; justify-content: center;">
                <button id="easyBtn" onclick="startQuiz('EASY')">Easy Mode</button>
                <button id="mediumBtn" onclick="startQuiz('MEDIUM')">Medium Mode</button>
                <button id="hardBtn" onclick="startQuiz('HARD')">Hard Mode</button>
            </div>
            <p id="loading-message" style="text-align: center; margin-top: 20px; display: none; color: #007bff;">Loading questions...</p>
        </div>

        <div id="quiz-area" class="quiz-area">
            <div id="question-counter"></div>
            <p id="question-title"></p>
            <div id="link-display" style="display: none;">
                <strong>Solution Link:</strong> <a id="question-link" href="#" target="_blank">View on LeetCode</a>
            </div>
            <div class="quiz-controls">
                <button id="revealBtn" onclick="revealLink()">Reveal Solution</button>
                <button id="nextBtn" onclick="nextQuestion()">Next Question</button>
            </div>
        </div>

        <div id="results-area" class="results">
            <h2>Quiz Complete! 🎉</h2>
            <p>You have finished the practice session for this difficulty.</p>
            <p>Ready for the next challenge?</p>
            <button onclick="window.location.reload()">Start New Quiz</button>
        </div>

    </div>

    <script>
        // --- QUIZ LOGIC (Client-Side JavaScript) ---

        let allQuestionsData = null; // Will store data fetched from raw_data.json
        let filteredQuestions = [];
        let currentQuestionIndex = 0;
        const QUIZ_LENGTH = 10; // Number of questions for a practice session

        // Function to load data from data/raw_data.json
        async function fetchQuestionsData() {
            document.getElementById('loading-message').style.display = 'block';
            try {
                // Fetch the JSON file from the specified path
                const response = await fetch('data/raw_data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                allQuestionsData = data;
                document.getElementById('loading-message').style.display = 'none';
            } catch (error) {
                console.error("Error loading questions data from data/raw_data.json:", error);
                document.getElementById('loading-message').textContent = 'Error loading data. Check console for details.';
                // Prevent quiz from starting if data fails to load
                document.getElementById('easyBtn').disabled = true;
                document.getElementById('mediumBtn').disabled = true;
                document.getElementById('hardBtn').disabled = true;
            }
        }

        // Initialize data loading when the page loads
        fetchQuestionsData();

        // Function to shuffle an array (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function startQuiz(difficulty) {
            // Wait for data to be loaded if it hasn't already
            if (allQuestionsData === null) {
                await fetchQuestionsData();
            }

            if (!allQuestionsData || allQuestionsData.length === 0) {
                alert("Question data is not available. Please check the data/raw_data.json file path.");
                return;
            }

            // 1. Filter Questions by Difficulty
            const allOfDifficulty = allQuestionsData.filter(q => 
                q.Difficulty && q.Difficulty.toUpperCase() === difficulty.toUpperCase()
            );

            if (allOfDifficulty.length === 0) {
                alert(`No questions found for ${difficulty} mode.`);
                return;
            }

            // 2. Shuffle and Select the Quiz Subset
            shuffleArray(allOfDifficulty);
            // Select up to QUIZ_LENGTH questions, or all if there aren't enough
            filteredQuestions = allOfDifficulty.slice(0, Math.min(QUIZ_LENGTH, allOfDifficulty.length));

            // 3. Initialize State
            currentQuestionIndex = 0;

            // 4. Update UI
            document.getElementById('mode-selection').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            document.getElementById('results-area').style.display = 'none';

            displayQuestion();
        }

        function displayQuestion() {
            if (currentQuestionIndex >= filteredQuestions.length) {
                // Quiz finished
                document.getElementById('quiz-area').style.display = 'none';
                document.getElementById('results-area').style.display = 'block';
                return;
            }

            const currentQuestion = filteredQuestions[currentQuestionIndex];

            // Update Counter
            document.getElementById('question-counter').textContent = `Question ${currentQuestionIndex + 1} of ${filteredQuestions.length}`;

            // Update Question Title
            document.getElementById('question-title').textContent = currentQuestion.Question;

            // Reset Link Display
            document.getElementById('link-display').style.display = 'none';
            document.getElementById('question-link').href = currentQuestion['Link of Question'];
            document.getElementById('revealBtn').style.display = 'inline-block';
        }

        function revealLink() {
            document.getElementById('link-display').style.display = 'block';
            document.getElementById('revealBtn').style.display = 'none';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            displayQuestion();
        }
    </script>
    <script type="module" src="js/darkmode-init.js"></script>
</body>
</html>
