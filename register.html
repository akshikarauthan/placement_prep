<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | LeetCrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/chatbot.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header"><h4>Register</h4></div>
          <div class="card-body">
            <form id="register-form">
              <div class="mb-3">
                <label for="reg-name" class="form-label">Name</label>
                <input type="text" class="form-control" id="reg-name" required />
              </div>
              <div class="mb-3">
                <label for="reg-age" class="form-label">Age</label>
                <input type="number" class="form-control" id="reg-age" min="1" max="120" required />
              </div>
              <div class="mb-3">
                <label for="reg-email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="reg-email" required />
              </div>
              <div class="mb-3">
                <label for="reg-password" class="form-label">Password</label>
                <input type="password" class="form-control" id="reg-password" required minlength="6" />
              </div>
              <button type="submit" class="btn btn-success w-100">Register</button>
            </form>
            <div id="register-message" class="mt-3"></div>
            <div class="mt-3 text-center">
              <a href="login.html">Already registered? Login here</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/register.js"></script>
</body>
</html>
