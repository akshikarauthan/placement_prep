<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | LeetCrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="overlay">
    <nav class="navbar">
      <a href="index.html">LeetCrack<span style="color: black;">.</span></a>
      <div style="display: flex; gap: 20px;">
        <a href="companies.html">Companies</a>
        <a href="roadmap.html">Roadmap</a>
        <a href="dashboard.html">Dashboard</a>
      </div>
    </nav>

    <div class="container mt-5">
      <h1 class="text-center mb-5">Your Progress Dashboard</h1>
      
      <div class="row">
        <div class="col-md-6">
          <div class="card mb-4">
            <div class="card-body">
              <h5 class="card-title">Completion Progress</h5>
              <canvas id="progressChart"></canvas>
            </div>
          </div>
        </div>
        
        <div class="col-md-6">
          <div class="card mb-4">
            <div class="card-body">
              <h5 class="card-title">Difficulty Breakdown</h5>
              <canvas id="difficultyChart"></canvas>
            </div>
          </div>
        </div>
      </div>
      
      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Recently Completed</h5>
              <ul id="recentlyCompleted" class="list-group list-group-flush">
                <!-- Populated by JavaScript -->
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script type="module" src="js/dashboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet"></script>
  <script src="https://cdn.jsdelivr.net/npm/annyang@2.6.1/dist/annyang.min.js"></script>
  <script type="module" src="js/floating-assistant.js"></script>
  <script type="module" src="js/voice-commands.js"></script>
  <script type="module" src="js/darkmode-init.js"></script>
</body>
</html>
