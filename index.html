<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>placement_prep</title>
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-image: url('assets/background.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .overlay {
      background-color: rgba(255, 255, 255, 0.85);
      min-height: 100vh;
      padding-bottom: 50px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08);
      font-weight: bold;
      background-color: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar a {
      text-decoration: none;
      color: #8b0000;
      font-size: 18px;
      transition: color 0.3s ease, transform 0.3s ease;
      position: relative;
    }
    
    .navbar a:hover {
      color: #ffd700;
      transform: translateY(-2px);
    }
    
    .navbar a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -4px;
      left: 0;
      background-color: #ffd700;
      transition: width 0.3s ease;
    }
    
    .navbar a:hover::after {
      width: 100%;
    }

    .centered {
      display: flex;
      justify-content: center;
      padding-top: 40px;
      text-align: center;
    }

    input[type="text"] {
      padding: 12px 20px;
      width: 300px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
    }
    
    input[type="text"]:focus {
      border-color: #8b0000;
      box-shadow: 0 2px 12px rgba(139,0,0,0.1);
      outline: none;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 30px;
      gap: 25px;
    }

    .card {
      background-color: #f8f9fa;
      border-radius: 15px;
      padding: 30px;
      min-width: 150px;
      text-align: center;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border-top: 4px solid #8b0000;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0px 12px 28px rgba(0, 0, 0, 0.18);
      border-top-color: #ffd700;
    }

    .card a {
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
      color: #8b0000;
    }

    .card-link {
        text-decoration: none;
    }

    .card-link .card {
        color: #8b0000;
        font-weight: bold;
        font-size: 20px;
    }

    #suggestions li:hover {
        background-color: #f9f9f9;
    }
    
    /* Animation container styling */
    /*#cube-animation-container {
      position: absolute;
      top: 80px;
      right: 30px;
      width: 300px;
      height: 300px;
      z-index: 0;
      opacity: 0.8;
    }*/
    
    /* Handwriting accent */
    .handwritten-accent {
      font-family: 'Caveat', cursive;
      font-size: 1.4em;
      color: #4b0082;
      transform: rotate(-2deg);
      display: inline-block;
      margin: 0 0.2em;
    }
    
    /* Footer styling */
    footer {
      background-color: #f8f9fa;
      padding: 20px 0;
      text-align: center;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
      .centered h1 {
        font-size: 1.8rem;
      }
      
      #cube-animation-container {
        width: 200px;
        height: 200px;
        top: auto;
        bottom: 20px;
        right: 20px;
      }
    }
  </style>
